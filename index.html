<!doctype html>
<html lang="fr" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0A0908" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />

    <!--
      Applique le thème mémorisé avant le premier rendu, pour éviter tout
      flash visuel : un visiteur ayant choisi le thème clair ne doit jamais
      voir apparaître le thème sombre (par défaut) une fraction de seconde.
      Le sombre reste la valeur par défaut tant qu'aucun choix n'est mémorisé.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('aller-retour-theme');
          if (stored === 'light') {
            document.documentElement.dataset.theme = 'light';
            document.querySelector('meta[name="theme-color"]').setAttribute('content', '#F7F1E4');
          }
        } catch (e) {}
      })();
    </script>

    <title>L'Aller Retour — Viandes &amp; Vins</title>
    <meta
      name="description"
      content="L'Aller Retour, restaurant de viandes rouges et de vins. Pièces d'exception, tartare au couteau, côte de bœuf, et une cave de plus de 300 références de 32 € à 999 €."
    />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph -->
    <meta property="og:type" content="restaurant" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:site_name" content="L'Aller Retour" />
    <meta property="og:title" content="L'Aller Retour — Viandes &amp; Vins" />
    <meta
      property="og:description"
      content="Viandes d'exception & vins de caractère. Une cave de plus de 300 références."
    />
    <!-- TODO : ajouter l'URL canonique et l'image de partage une fois le domaine connu.
         <meta property="og:url" content="https://…" />
         <meta property="og:image" content="https://…/og.jpg" /> -->

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="L'Aller Retour — Viandes &amp; Vins" />
    <meta
      name="twitter:description"
      content="Viandes d'exception & vins de caractère. Une cave de plus de 300 références."
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Inter:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
